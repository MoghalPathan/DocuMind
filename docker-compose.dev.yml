services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage


  api:
    build: .
    image: documind
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant 
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./data:/app/data
volumes:
  qdrant_data:
  hf_cache:
    
